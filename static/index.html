<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Platform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- AUTH REMOVED: login/register forms deleted, dashboard is now the
             only view and is visible by default (no inline display:none). -->
        <div id="dashboard">
            <nav class="navbar">
                <div class="logo">🎬 MovieAdmin</div>
                <div class="user-info">
                    <span id="user-role"></span>
                </div>
            </nav>
            <div class="sidebar">
                <ul>
                    <li data-view="movies">Movies</li>
                    <li data-view="stats">Stats</li>
                    <li data-view="users" id="admin-users-menu" style="display:none">Users</li>
                    <li data-view="upload" id="admin-upload-menu" style="display:none">Upload JSON</li>
                </ul>
            </div>
            <div class="main-content">
                <div id="view-container"></div>
            </div>
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
